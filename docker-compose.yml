services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-webshop}:${POSTGRES_PASSWORD:-webshop}@db:5432/${POSTGRES_DB:-webshop}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env (openssl rand -base64 32)}
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webshop}
      POSTGRES_DB: ${POSTGRES_DB:-webshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-webshop} -d $${POSTGRES_DB:-webshop}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-data:
  db-data:
